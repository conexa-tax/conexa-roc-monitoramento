<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CONEXA · Capturas ROC/CBS</title><style>body{font:15px system-ui,sans-serif;margin:0;background:#f3f7fa;color:#0b2349}.wrap{max-width:1050px;margin:auto;padding:28px}header{background:#08143e;color:white;padding:30px 0}h1{margin:0;font-size:27px}.small{color:#687990;font-size:12px}.report{background:white;border:1px solid #dce7ed;padding:18px;border-radius:12px;margin:15px 0}.report img{display:block;width:100%;height:auto}a{color:#0097b2}button{border:0;background:#0097b2;color:white;border-radius:8px;padding:10px 16px;cursor:pointer}time{font-weight:600}</style><header><div class="wrap"><h1>CONEXA · Arquivo de capturas ROC/CBS</h1><p>Capturas automatizadas do painel público da Receita Federal. Não são dados oficiais extraídos por API.</p></div></header><main class="wrap"><div class="report"><p id="status">Carregando informações...</p><p class="small">A data da captura é diferente da data de atualização da base da Receita.</p><button type="button" onclick="location.reload()">Verificar novas capturas</button> <a href="https://app.powerbi.com/view?r=eyJrIjoiNzg5MDA4M2UtYWZiZC00Y2U5LTkzYjctNTc4MzBkYTU0ZDhkIiwidCI6IjZmNDlhYTQzLTgyMmEtNGMyMC05NjcwLWRiNzcwMGJmMWViMCJ9" target="_blank" rel="noopener noreferrer">Abrir Power BI original</a></div><div id="gallery"></div></main><script>fetch('./capturas/manifest.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Manifesto indisponível');return r.json()}).then(m=>{document.getElementById('status').textContent=m.status==='ok'&&m.pages?.length?'Capturado em '+new Date(m.capturedAt).toLocaleString('pt-BR')+' · '+m.pages.length+' página(s)':'Aguardando primeira captura válida.';const div=document.getElementById('gallery');if(m.status==='ok')for(const pg of m.pages){const section=document.createElement('section');section.className='report';const title=document.createElement('h2');title.textContent=pg.label||'Página do relatório';const img=document.createElement('img');img.src='./capturas/'+encodeURIComponent(pg.filename);img.loading='lazy';img.alt=pg.label||'Página do painel público ROC/CBS';section.append(title,img);div.append(section)}}).catch(e=>document.getElementById('status').textContent='Não foi possível conferir as capturas: '+e.message)</script></html>
